<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - KAZUNO OFFICIAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 18px}
.back{position:absolute;top:18px;left:18px;color:#D4AF37;border:1px solid #D4AF37;padding:6px 12px;border-radius:20px;text-decoration:none;font-size:13px}
.logo-box{margin-top:60px;margin-bottom:22px;text-align:center}
.logo-box img{width:240px;max-width:75vw}
h1{font-size:36px;font-weight:900;letter-spacing:1px}
.sub{color:#777;font-size:11px;letter-spacing:2px;margin:10px 0 30px;text-transform:uppercase}
.input-box{background:#0e0e0e;border:1px solid #222;border-radius:28px;padding:15px 18px;display:flex;align-items:center;gap:10px;width:100%;max-width:380px;margin-bottom:18px}
.input-box input{background:transparent;border:none;outline:none;color:#fff;font-size:15px;width:100%}
.btn-otp{background:#7ec8e3;color:#fff;border:none;width:100%;max-width:380px;padding:16px;border-radius:28px;font-weight:800;font-size:16px;letter-spacing:2px;cursor:pointer;display:flex;justify-content:center;gap:8px;margin-bottom:22px}
.divider{color:#555;font-size:11px;letter-spacing:3px;margin-bottom:22px;display:flex;align-items:center;gap:14px;width:100%;max-width:380px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#222}
.btn-google{background:#161616;border:1px solid #222;width:100%;max-width:380px;padding:5px;border-radius:28px;display:flex;align-items:center;gap:14px;cursor:pointer}
.g-icon{background:#fff;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:#4285F4;font-weight:900;font-size:22px}
.btn-google span{flex:1;text-align:center;font-weight:600;padding-right:42px}
.terms{margin-top:auto;padding-top:40px;text-align:center;color:#666;font-size:11px;line-height:1.6}
.terms a{color:#7ec8e3;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<a class="back" href="index.html">← Back</a>
<div class="logo-box"><img src="logo.png" alt="KAZUNO OFFICIAL"></div>
<h1>Login / Register</h1>
<div class="sub">SIGN IN TO YOUR ACCOUNT / REGISTER</div>
<div class="input-box">✉️ <input type="email" id="email" placeholder="yourname@gmail.com"></div>
<button class="btn-otp" onclick="sendOTP()">SEND OTP ⚡</button>
<div class="divider">OR SIGN IN WITH</div>
<button class="btn-google" onclick="alert('Google Login - connect Firebase later')"><div class="g-icon">G</div><span>Sign in with Google</span></button>
<div class="terms">By logging in or registering, you agree to our<br><a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></div>
<script>
function sendOTP(){let e=document.getElementById('email').value;if(!e){alert('Enter email');return}alert('OTP sent to '+e);}
</script>
</body>
</html>
