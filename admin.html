<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAZUNO ADMIN</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#080608;color:#fff;padding:15px}
h2{color:#D4AF37;text-align:center}
.card{background:#111;border:1px solid #D4AF37;border-radius:10px;padding:12px;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.btn{border:none;padding:8px 14px;border-radius:20px;font-weight:800;cursor:pointer}
.btn-gold{background:linear-gradient(#ffcf66,#D4AF37);color:#000}
.btn-red{background:#ff3333;color:#fff}
.btn-green{background:#1ec96b;color:#000}
.status{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:700}
.PENDING{background:orange;color:#000}.PAID{background:#1ec96b;color:#000}.DELIVERED{background:#D4AF37;color:#000}
input{padding:10px;width:100%;border-radius:8px;border:1px solid #D4AF37;background:#000;color:#fff}
#login{max-width:360px;margin:80px auto;background:#111;border:1px solid #D4AF37;border-radius:12px;padding:20px;text-align:center}
</style></head><body>

<div id="login">
<h2>KAZUNO ADMIN</h2><p style="color:#aaa;font-size:12px">Enter PIN to manage orders</p>
<input id="pin" type="password" placeholder="PIN is 1234">
<button class="btn btn-gold" style="width:100%;margin-top:12px" onclick="login()">LOGIN</button>
<p id="err" style="color:red;font-size:12px;display:none">Wrong PIN</p>
</div>

<div id="panel" style="display:none">
<h2>KAZUNO ADMIN PANEL</h2>
<div class="top">
<div>Orders: <b id="count">0</b> | Revenue: <b id="rev">₹0</b></div>
<div style="display:flex;gap:6px"><button class="btn btn-green" onclick="load()">Refresh</button>
<button class="btn btn-red" onclick="clearAll()">Clear All Test</button>
<button class="btn" style="background:#333;color:#fff" onclick="logout()">Logout</button></div>
</div>
<div id="list"></div>
</div>

<script>
const PIN="1234";
const KEYS=["kazuno_orders","orders","mlbb_orders"];
function getOrders(){
 let all=[]; KEYS.forEach(k=>{try{let d=JSON.parse(localStorage.getItem(k)||"[]"); if(Array.isArray(d)) all=all.concat(d)}catch(e){}});
 // remove duplicates by id
 let map={}; all.forEach(o=>{ if(o.id||o.orderId) map[o.id||o.orderId]=o });
 return Object.values(map);
}
function login(){
 if(document.getElementById('pin').value===PIN){
  localStorage.setItem('kazuno_admin','1');
  document.getElementById('login').style.display='none';
  document.getElementById('panel').style.display='block'; load();
 } else document.getElementById('err').style.display='block';
}
function logout(){localStorage.removeItem('kazuno_admin'); location.reload();}
function load(){
 let orders=getOrders();
 document.getElementById('count').innerText=orders.length;
 let rev=0; orders.forEach(o=>rev+=Number(o.amount||o.price||o.total||0));
 document.getElementById('rev').innerText="₹"+rev;
 let html=""; if(!orders.length) html='<p style="text-align:center;color:#aaa;margin-top:30px">No orders found on THIS device.<br><small>Note: Orders are saved in customer phone only, not in admin phone. To see ALL customers live, we need Firebase (next step).</small></p>';
 orders.reverse().forEach(o=>{
  html+=`<div class="card"><div class="top"><div><b>${o.id||o.orderId||'KZ'}</b> - ${o.game||o.product||'MLBB'} - ${o.pack||o.title||''}<br><small>${o.playerId||o.uid||''} | ${o.date||o.time||''}</small><br>₹${o.amount||o.price||o.total||0}</div>
  <div style="text-align:right"><span class="status ${o.status||'PENDING'}">${o.status||'PENDING'}</span><br><br>
  <button class="btn btn-gold" style="font-size:11px" onclick="mark('${o.id||o.orderId}','PAID')">Mark PAID</button>
  <button class="btn btn-green" style="font-size:11px" onclick="mark('${o.id||o.orderId}','DELIVERED')">Delivered</button>
  <button class="btn btn-red" style="font-size:11px" onclick="delOne('${o.id||o.orderId}')">X</button></div></div></div>`;
 });
 document.getElementById('list').innerHTML=html;
}
function mark(id,status){
 let orders=getOrders(); orders.forEach(o=>{if((o.id||o.orderId)==id) o.status=status});
 saveAll(orders); load();
}
function delOne(id){
 let orders=getOrders().filter(o=>(o.id||o.orderId)!=id); saveAll(orders); load();
}
function saveAll(orders){
 // save to first key found
 localStorage.setItem(KEYS[0], JSON.stringify(orders));
 localStorage.setItem(KEYS[1], JSON.stringify(orders));
}
function clearAll(){ if(confirm('Delete ALL test orders from THIS phone?')){ KEYS.forEach(k=>localStorage.removeItem(k)); load(); }}
if(localStorage.getItem('kazuno_admin')=='1'){ document.getElementById('login').style.display='none'; document.getElementById('panel').style.display='block'; load();}
</script></body></html>
